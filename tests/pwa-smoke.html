<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA Smoke Tests</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; }
    li { margin: 0.5rem 0; }
    .pass { color: #065f46; }
    .fail { color: #991b1b; }
    #appFrame { border: 0; height: 1px; opacity: 0; position: absolute; width: 1px; }
  </style>
</head>
<body>
  <h1>PWA Smoke Tests</h1>
  <p id="summary" role="status" aria-live="polite">Starting app and checking its offline assets…</p>
  <ol id="results"></ol>
  <iframe id="appFrame" src="../index.html?smoke-test"></iframe>
  <script>
    const results = document.getElementById("results");
    let passed = 0;
    let failed = 0;

    function record(name, success, detail = "") {
      const item = document.createElement("li");
      item.className = success ? "pass" : "fail";
      item.textContent = `${success ? "PASS" : "FAIL"} — ${name}${detail ? `: ${detail}` : ""}`;
      results.appendChild(item);
      if (success) passed += 1;
      else failed += 1;
    }

    function waitFor(check, timeoutMs = 10000) {
      const started = Date.now();
      return new Promise((resolve, reject) => {
        const poll = async () => {
          try {
            const result = await check();
            if (result) return resolve(result);
          } catch (error) {
            if (Date.now() - started >= timeoutMs) return reject(error);
          }
          if (Date.now() - started >= timeoutMs) return reject(new Error("Timed out waiting for the app."));
          setTimeout(poll, 100);
        };
        poll();
      });
    }

    function openDatabase(frameWindow) {
      return new Promise((resolve, reject) => {
        const request = frameWindow.indexedDB.open("fs-conductors");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function readSchedule(database) {
      return new Promise((resolve, reject) => {
        const request = database.transaction("appData").objectStore("appData").get("schedule");
        request.onsuccess = () => resolve(request.result && request.result.value);
        request.onerror = () => reject(request.error);
      });
    }

    async function run() {
      const frameWindow = document.getElementById("appFrame").contentWindow;
      let appReady = false;
      let database = null;
      try {
        database = await openDatabase(frameWindow);
        await waitFor(async () => {
          const state = await readSchedule(database);
          return state && Array.isArray(state.roster) && frameWindow.document.querySelector("h1");
        });
        record("App initializes with a valid IndexedDB schedule", true);
        appReady = true;
      } catch (error) {
        record("App initializes with a valid IndexedDB schedule", false, error.message);
      }

      if (appReady) {
        record("Cloud sync status is accessible", frameWindow.document.getElementById("cloudSyncStatusDetail")?.getAttribute("aria-live") === "polite");
        record(
          "Update and retry controls are wired",
          typeof frameWindow.installAppUpdate === "function" &&
            typeof frameWindow.retryCloudSync === "function"
        );

        frameWindow.openPrintModal();
        const printActions = frameWindow.document.querySelectorAll("#printModal .modal-actions > *");
        record(
          "Print/PDF dialog has one print action",
          printActions.length === 2 &&
            printActions[1].textContent.includes("Print / Save PDF")
        );
        frameWindow.closePrintModal();

        const printSheet = frameWindow.buildPrintSheetHTML("3", 2026, 10);
        const printMonthCount = (printSheet.match(/class="print-month-block"/g) || []).length;
        record("Print sheet renders the selected month range", printMonthCount === 3);

        record(
          "SMS links encode body text safely",
          frameWindow.buildSmsLink(["+19045550123"], "Meet & greet") ===
            "sms:+19045550123?body=Meet%20%26%20greet"
        );
        const originalLoadAppState = frameWindow.loadAppState;
        try {
          frameWindow.openShareModal("all", null, "text");
          frameWindow.loadAppState = () => ({
            roster: ["Scheduled Conductor", "No Schedule This Timeframe"],
            contacts: {
              "Scheduled Conductor": { phone: "+1 202 555 0101" },
              "No Schedule This Timeframe": { phone: "+1 202 555 0102" }
            }
          });
          frameWindow.populateShareRecipients();
          record(
            "Group text includes saved phone numbers for the full roster",
            frameWindow.document.getElementById("shareRecipientInput").value ===
              "+1 202 555 0101, +1 202 555 0102"
          );
        } catch (error) {
          record("Group text includes saved phone numbers for the full roster", false, error.message);
        } finally {
          frameWindow.loadAppState = originalLoadAppState;
          frameWindow.closeShareModal();
        }
        record(
          "Email recipients accept comma and semicolon separators",
          frameWindow.parseEmailRecipients("one@example.com; two@example.com").length === 2
        );

        const originalOpen = frameWindow.open;
        const originalEmailFields = {
          recipients: frameWindow.document.getElementById("shareRecipientInput").value,
          subject: frameWindow.document.getElementById("shareEmailSubject").value,
          message: frameWindow.document.getElementById("shareMessageTextarea").value
        };
        let openedEmailUrl = "";
        let emailWindowTarget = "";
        try {
          frameWindow.open = (url, target) => {
            openedEmailUrl = url;
            emailWindowTarget = target;
          };
          frameWindow.document.getElementById("shareRecipientInput").value = "one@example.com; two@example.com";
          frameWindow.document.getElementById("shareEmailSubject").value = "Schedule & updates";
          frameWindow.document.getElementById("shareMessageTextarea").value = "Meet & greet";
          await frameWindow.emailModalMessage();
          const gmailUrl = new URL(openedEmailUrl);
          record(
            "Email action opens Gmail compose with recipients and message",
            gmailUrl.origin === "https://mail.google.com" &&
              gmailUrl.searchParams.get("view") === "cm" &&
              gmailUrl.searchParams.get("to") === "one@example.com,two@example.com" &&
              gmailUrl.searchParams.get("su") === "Schedule & updates" &&
              gmailUrl.searchParams.get("body") === "Meet & greet" &&
              emailWindowTarget === "_blank"
          );
        } catch (error) {
          record("Email action opens Gmail compose with recipients and message", false, error.message);
        } finally {
          frameWindow.open = originalOpen;
          frameWindow.document.getElementById("shareRecipientInput").value = originalEmailFields.recipients;
          frameWindow.document.getElementById("shareEmailSubject").value = originalEmailFields.subject;
          frameWindow.document.getElementById("shareMessageTextarea").value = originalEmailFields.message;
        }

        const shareNavigator = frameWindow.navigator;
        const originalShareDescriptor = Object.getOwnPropertyDescriptor(shareNavigator, "share");
        const shareTestDate = "2999-12-31";
        try {
          Object.defineProperty(shareNavigator, "share", {
            configurable: true,
            value: () => Promise.resolve()
          });
          frameWindow.openShareModal("single", "Judy Fain", "text", shareTestDate);
          await frameWindow.shareModalMessage();
          const reminders = frameWindow.loadAppState().reminders || {};
          record("Opening the share sheet does not mark a schedule sent", !reminders[shareTestDate]);
        } catch (error) {
          record("Opening the share sheet does not mark a schedule sent", false, error.message);
        } finally {
          frameWindow.closeShareModal();
          if (originalShareDescriptor) {
            Object.defineProperty(shareNavigator, "share", originalShareDescriptor);
          } else {
            delete shareNavigator.share;
          }
        }

        const configKey = "conductor_gist_config";
        const originalConfig = frameWindow.localStorage.getItem(configKey);
        const testToken = "smoke-test-token-not-a-real-credential";
        try {
          frameWindow.saveGistConfig({ token: testToken, gistId: "smoke-test-gist", autoSync: false });
          const storedConfig = JSON.parse(frameWindow.localStorage.getItem(configKey) || "{}");
          record(
            "GitHub token persists in this browser",
            storedConfig.token === testToken && frameWindow.loadGistConfig().token === testToken
          );

          frameWindow.saveGistConfig({ token: "", gistId: "", autoSync: false });
          const disconnectedConfig = JSON.parse(frameWindow.localStorage.getItem(configKey) || "{}");
          record(
            "Local mode removes the saved GitHub token",
            !Object.prototype.hasOwnProperty.call(disconnectedConfig, "token")
          );
        } catch (error) {
          record("GitHub token persistence and Local-mode clearing", false, error.message);
        } finally {
          if (originalConfig === null) frameWindow.localStorage.removeItem(configKey);
          else frameWindow.localStorage.setItem(configKey, originalConfig);
          frameWindow.updateCloudSyncPill();
        }
      }

      try {
        const requiredAssets = ["index.html", "styles.css", "js/storage.js", "js/cloud-sync.js"];
        const cachedAssets = await waitFor(async () => {
          const cacheName = (await frameWindow.caches.keys())
            .filter(name => name.startsWith("fs-conductors-v"))
            .sort()
            .pop();
          if (!cacheName) return null;
          const cache = await frameWindow.caches.open(cacheName);
          const paths = (await cache.keys()).map(request => new URL(request.url).pathname);
          return requiredAssets.every(asset => paths.some(path => path.endsWith(`/${asset}`))) ? paths : null;
        });
        const missingAssets = requiredAssets.filter(asset => !cachedAssets.some(path => path.endsWith(`/${asset}`)));
        record("Core app assets are precached", missingAssets.length === 0, missingAssets.join(", "));
      } catch (error) {
        record("Core app assets are precached", false, error.message);
      }
      if (database) database.close();

      document.getElementById("summary").textContent =
        `${passed} passed, ${failed} failed. This smoke suite does not modify schedule data.`;
    }

    document.getElementById("appFrame").addEventListener("load", run, { once: true });
  </script>
</body>
</html>
