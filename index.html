<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conductor Schedule</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conductor">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --override-bg: #fef3c7;
      --override-text: #92400e;
      --blackout-bg: #fee2e2;
      --blackout-text: #991b1b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 850px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button {
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button.success { background-color: var(--success); }
    button.secondary { background-color: #64748b; }

    .roster-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .roster-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .roster-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { background: #f1f5f9; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-override { background: var(--override-bg); color: var(--override-text); }
    .badge-blackout { background: var(--blackout-bg); color: var(--blackout-text); }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Conductor Schedule</h1>
    <div class="header-actions">
      <div>
        <label for="yearSelect"><strong>Year:</strong> </label>
        <select id="yearSelect">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
        </select>
      </div>
      <button class="success" onclick="exportMasterICS()">Export schedule.ics</button>
    </div>
  </header>

  <!-- ROSTER MANAGEMENT & BACKUP PANEL -->
  <section class="roster-card">
    <div class="card-header">
      <strong>Current Rotation Order:</strong>
      <div class="actions">
        <button class="secondary btn-sm" onclick="promptUpdateRoster()">Edit Roster</button>
        <button class="secondary btn-sm" onclick="exportStateJSON()">Export JSON</button>
        <button class="secondary btn-sm" onclick="triggerImportJSON()">Import JSON</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="handleImportJSON(event)">
      </div>
    </div>
    <div class="roster-tags" id="rosterDisplay"></div>
  </section>

  <!-- SCHEDULE DISPLAY TABLE -->
  <main>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Assigned Conductor</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="scheduleTableBody"></tbody>
    </table>
  </main>

  <script>
    // --- SERVICE WORKER REGISTRATION & AUTO-REFRESH ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New PWA version detected. Auto-refreshing...');
                  }
                });
              }
            });
          })
          .catch(err => console.error('Service Worker Registration Error:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

    // --- ROTATIONAL ENGINE (2nd & 4th Saturdays) ---
    function getMeetingDates(year) {
      const meetingDates = [];
      for (let month = 0; month < 12; month++) {
        const firstDay = new Date(year, month, 1);
        const dayOfWeek = firstDay.getDay();
        const firstSat = (6 - dayOfWeek + 7) % 7 + 1;
        const secondSat = new Date(year, month, firstSat + 7);
        const fourthSat = new Date(year, month, firstSat + 21);
        meetingDates.push(secondSat, fourthSat);
      }
      return meetingDates;
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateDisplay(dateStr) {
      const [year, month, day] = dateStr.split('-');
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    const DEFAULT_STATE = {
      roster: ["Conductor A", "Conductor B", "Conductor C", "Conductor D"],
      overrides: {},
      blackouts: {}
    };

    function loadAppState() {
      const saved = localStorage.getItem("conductor_schedule_state");
      return saved ? JSON.parse(saved) : DEFAULT_STATE;
    }

    function saveAppState(state) {
      localStorage.setItem("conductor_schedule_state", JSON.stringify(state));
      renderUI();
    }

    function generateSchedule(year) {
      const state = loadAppState();
      const dates = getMeetingDates(year);
      const schedule = [];
      let rosterIndex = 0;

      dates.forEach(date => {
        const dateKey = formatDateKey(date);
        
        if (state.blackouts[dateKey]) {
          schedule.push({ date: dateKey, conductor: "CANCELLED / NO MEETING", isOverride: false, isBlackout: true });
          return;
        }

        if (state.overrides[dateKey]) {
          schedule.push({ date: dateKey, conductor: state.overrides[dateKey], isOverride: true, isBlackout: false });
          rosterIndex = (rosterIndex + 1) % state.roster.length;
          return;
        }

        const assignedConductor = state.roster[rosterIndex];
        schedule.push({ date: dateKey, conductor: assignedConductor, isOverride: false, isBlackout: false });
        rosterIndex = (rosterIndex + 1) % state.roster.length;
      });

      return schedule;
    }

    // --- JSON BACKUP EXPORT & IMPORT ---
    function exportStateJSON() {
      const state = loadAppState();
      const jsonStr = JSON.stringify(state, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const link = document.createElement("a");
      const todayStr = formatDateKey(new Date());
      
      link.href = URL.createObjectURL(blob);
      link.download = `conductor-schedule-backup-${todayStr}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function triggerImportJSON() {
      document.getElementById("importFileInput").click();
    }

    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedState = JSON.parse(e.target.result);
          if (importedState && Array.isArray(importedState.roster)) {
            const stateToSave = {
              roster: importedState.roster,
              overrides: importedState.overrides || {},
              blackouts: importedState.blackouts || {}
            };
            saveAppState(stateToSave);
            alert("Schedule state restored successfully!");
          } else {
            alert("Invalid backup file structure.");
          }
        } catch (err) {
          alert("Failed to parse JSON backup file: " + err.message);
        }
        event.target.value = "";
      };
      reader.readAsText(file);
    }

    // --- MASTER ICS EXPORTER (Saves to schedule.ics) ---
    function exportMasterICS() {
      const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);
      const schedule = generateSchedule(selectedYear);
      const nowString = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      
      let icsLines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Conductor Schedule Generator//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        `X-WR-CALNAME:Conductor Schedule ${selectedYear}`,
        "X-WR-TIMEZONE:America/New_York"
      ];

      schedule.forEach(slot => {
        if (slot.isBlackout) return;

        const [y, m, d] = slot.date.split('-');
        const dtStart = `${y}${m}${d}T093000`;
        const dtEnd = `${y}${m}${d}T110000`;
        const uid = `conductor-meeting-${slot.date}@conductorschedule.local`;

        icsLines.push(
          "BEGIN:VEVENT",
          `UID:${uid}`,
          `DTSTAMP:${nowString}`,
          `DTSTART;TZID=America/New_York:${dtStart}`,
          `DTEND;TZID=America/New_York:${dtEnd}`,
          `SUMMARY:Conductor Duty: ${slot.conductor}`,
          `DESCRIPTION:Scheduled rotational conductor assignment.`,
          "STATUS:CONFIRMED",
          "END:VEVENT"
        );
      });

      icsLines.push("END:VCALENDAR");

      const blob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "schedule.ics";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // --- SINGLE EVENT ICS EXPORTER ---
    function exportSingleICS(dateStr, conductor) {
      if (!conductor || conductor.includes("CANCELLED")) return;
      const [y, m, d] = dateStr.split('-');
      const nowString = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const dtStart = `${y}${m}${d}T093000`;
      const dtEnd = `${y}${m}${d}T110000`;
      const uid = `conductor-meeting-${dateStr}@conductorschedule.local`;

      const icsLines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Conductor Schedule Generator//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "X-WR-TIMEZONE:America/New_York",
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${nowString}`,
        `DTSTART;TZID=America/New_York:${dtStart}`,
        `DTEND;TZID=America/New_York:${dtEnd}`,
        `SUMMARY:Conductor Duty: ${conductor}`,
        `DESCRIPTION:Conductor assignment for ${formatDateDisplay(dateStr)}.`,
        "STATUS:CONFIRMED",
        "END:VEVENT",
        "END:VCALENDAR"
      ];

      const blob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `conductor-${dateStr}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // --- WEB SHARE API ---
    async function shareMeeting(dateStr, conductor) {
      if (!conductor || conductor.includes("CANCELLED")) return;
      const displayDate = formatDateDisplay(dateStr);
      const shareData = {
        title: `Conductor Assignment`,
        text: `Reminder: ${conductor} is scheduled to conduct the meeting on ${displayDate}.`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') console.error('Share failed:', err);
        }
      } else {
        try {
          await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
          alert("Assignment details copied to clipboard!");
        } catch (err) {
          alert(`${shareData.text}`);
        }
      }
    }

    // --- UI RENDER & CONTROLLERS ---
    function renderUI() {
      const state = loadAppState();
      const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);
      
      const rosterContainer = document.getElementById("rosterDisplay");
      rosterContainer.innerHTML = state.roster
        .map((name, index) => `<span class="roster-tag">${index + 1}. ${name}</span>`)
        .join("");

      const schedule = generateSchedule(selectedYear);
      const tbody = document.getElementById("scheduleTableBody");
      
      tbody.innerHTML = schedule.map(slot => {
        let statusBadge = `<span class="badge" style="background:#e2e8f0; color:#475569;">Standard</span>`;
        if (slot.isBlackout) statusBadge = `<span class="badge badge-blackout">Cancelled</span>`;
        else if (slot.isOverride) statusBadge = `<span class="badge badge-override">Override</span>`;

        const escapedConductor = slot.conductor.replace(/'/g, "\\'");

        const singleIcsBtn = slot.isBlackout 
          ? '' 
          : `<button class="btn-sm success" onclick="exportSingleICS('${slot.date}', '${escapedConductor}')">.ics</button>`;
