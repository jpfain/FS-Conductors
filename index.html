<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conductor Schedule</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --override-bg: #fef3c7;
      --override-text: #92400e;
      --blackout-bg: #fee2e2;
      --blackout-text: #991b1b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select, button, input {
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button.secondary {
      background-color: #64748b;
    }

    .roster-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .roster-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .roster-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { background: #f1f5f9; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-override { background: var(--override-bg); color: var(--override-text); }
    .badge-blackout { background: var(--blackout-bg); color: var(--blackout-text); }

    .actions { display: flex; gap: 6px; }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      th:nth-child(3), td:nth-child(3) { display: none; } /* Hide Status column on mobile */
    }
  </style>
</head>
<body>

  <header>
    <h1>Conductor Schedule</h1>
    <div>
      <label for="yearSelect"><strong>Year:</strong> </label>
      <select id="yearSelect">
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
      </select>
    </div>
  </header>

  <!-- ROSTER MANAGEMENT PANEL -->
  <section class="roster-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <strong>Current Rotation Order:</strong>
      <button class="secondary btn-sm" onclick="promptUpdateRoster()">Edit Roster</button>
    </div>
    <div class="roster-tags" id="rosterDisplay"></div>
  </section>

  <!-- SCHEDULE DISPLAY TABLE -->
  <main>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Assigned Conductor</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="scheduleTableBody"></tbody>
    </table>
  </main>

  <script>
    // --- PHASE 1 ENGINE CODE ---
    function getMeetingDates(year) {
      const meetingDates = [];
      for (let month = 0; month < 12; month++) {
        const firstDay = new Date(year, month, 1);
        const dayOfWeek = firstDay.getDay();
        const firstSat = (6 - dayOfWeek + 7) % 7 + 1;
        const secondSat = new Date(year, month, firstSat + 7);
        const fourthSat = new Date(year, month, firstSat + 21);
        meetingDates.push(secondSat, fourthSat);
      }
      return meetingDates;
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateDisplay(dateStr) {
      const [year, month, day] = dateStr.split('-');
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    const DEFAULT_STATE = {
      roster: ["Conductor A", "Conductor B", "Conductor C", "Conductor D"],
      overrides: {},
      blackouts: {}
    };

    function loadAppState() {
      const saved = localStorage.getItem("conductor_schedule_state");
      return saved ? JSON.parse(saved) : DEFAULT_STATE;
    }

    function saveAppState(state) {
      localStorage.setItem("conductor_schedule_state", JSON.stringify(state));
      renderUI();
    }

    function generateSchedule(year) {
      const state = loadAppState();
      const dates = getMeetingDates(year);
      const schedule = [];
      let rosterIndex = 0;

      dates.forEach(date => {
        const dateKey = formatDateKey(date);
        
        if (state.blackouts[dateKey]) {
          schedule.push({ date: dateKey, conductor: "CANCELLED / NO MEETING", isOverride: false, isBlackout: true });
          return;
        }

        if (state.overrides[dateKey]) {
          schedule.push({ date: dateKey, conductor: state.overrides[dateKey], isOverride: true, isBlackout: false });
          rosterIndex = (rosterIndex + 1) % state.roster.length;
          return;
        }

        const assignedConductor = state.roster[rosterIndex];
        schedule.push({ date: dateKey, conductor: assignedConductor, isOverride: false, isBlackout: false });
        rosterIndex = (rosterIndex + 1) % state.roster.length;
      });

      return schedule;
    }

    // --- UI BINDINGS & CONTROLLERS ---
    function renderUI() {
      const state = loadAppState();
      const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);
      
      // 1. Render Roster Tags
      const rosterContainer = document.getElementById("rosterDisplay");
      rosterContainer.innerHTML = state.roster
        .map((name, index) => `<span class="roster-tag">${index + 1}. ${name}</span>`)
        .join("");

      // 2. Render Schedule Rows
      const schedule = generateSchedule(selectedYear);
      const tbody = document.getElementById("scheduleTableBody");
      
      tbody.innerHTML = schedule.map(slot => {
        let statusBadge = `<span class="badge" style="background:#e2e8f0; color:#475569;">Standard</span>`;
        if (slot.isBlackout) statusBadge = `<span class="badge badge-blackout">Cancelled</span>`;
        else if (slot.isOverride) statusBadge = `<span class="badge badge-override">Override</span>`;

        return `
          <tr>
            <td><strong>${formatDateDisplay(slot.date)}</strong></td>
            <td>${slot.conductor}</td>
            <td>${statusBadge}</td>
            <td class="actions">
              <button class="btn-sm secondary" onclick="handleOverridePrompt('${slot.date}', '${slot.conductor}')">Override</button>
              <button class="btn-sm secondary" onclick="toggleBlackout('${slot.date}')">${slot.isBlackout ? 'Restore' : 'Cancel'}</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // --- EVENT HANDLERS ---
    function handleOverridePrompt(dateKey, currentConductor) {
      const state = loadAppState();
      const conductorList = state.roster.join(", ");
      const choice = prompt(`Select conductor for ${formatDateDisplay(dateKey)}:\nAvailable: ${conductorList}`, currentConductor);
      
      if (choice !== null && choice.trim() !== "") {
        state.overrides[dateKey] = choice.trim();
        saveAppState(state);
      }
    }

    function toggleBlackout(dateKey) {
      const state = loadAppState();
      if (state.blackouts[dateKey]) {
        delete state.blackouts[dateKey];
      } else {
        state.blackouts[dateKey] = true;
      }
      saveAppState(state);
    }

    function promptUpdateRoster() {
      const state = loadAppState();
      const currentList = state.roster.join(", ");
      const input = prompt("Enter conductors in rotation order (comma-separated):", currentList);
      
      if (input !== null) {
        const newList = input.split(",").map(s => s.trim()).filter(s => s.length > 0);
        if (newList.length > 0) {
          state.roster = newList;
          saveAppState(state);
        }
      }
    }

    // Initial Load
    document.getElementById("yearSelect").addEventListener("change", renderUI);
    window.addEventListener("DOMContentLoaded", renderUI);
  </script>
</body>
</html>
