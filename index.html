<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Conductor Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #059669;
      --accent: #2563eb;
      --danger: #ef4444;
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
      --blackout-bg: #fee2e2;
      --blackout-text: #991b1b;
      --meeting-bg: #dbeafe;
      --meeting-border: #3b82f6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: clamp(12px, 3vw, 24px);
      padding-bottom: calc(clamp(12px, 3vw, 24px) + env(safe-area-inset-bottom));
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: clamp(16px, 3vw, 24px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select, input, textarea {
      font-family: inherit;
      font-size: 0.875rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    button, select, input { min-height: 40px; }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover { opacity: 0.9; }
    button.secondary { background-color: #64748b; }
    button.success { background-color: var(--secondary); }
    button.accent { background-color: var(--accent); }
    button.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.active { background-color: var(--primary); color: white; border-color: var(--primary); }

    /* Roster Panel */
    .roster-card {
      background: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }

    .roster-header {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .anchor-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }

    .anchor-control input[type="date"] {
      min-height: 28px;
      padding: 2px 6px;
      font-size: 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    .roster-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .roster-input {
      flex: 1;
      background: white;
    }

    .roster-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tag-num {
      background: var(--primary);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .tag-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag-move {
      color: #475569;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      line-height: 1;
      min-height: auto;
    }

    .tag-move:hover:not(:disabled) {
      background: #ffffff;
      color: var(--primary);
    }

    .tag-move:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .tag-remove {
      color: #64748b;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0 4px;
      font-size: 1.1rem;
      line-height: 1;
      min-height: auto;
    }

    .tag-remove:hover { color: var(--danger); }

    /* Action Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .view-toggle {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .view-toggle button {
      min-height: 34px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Month Navigation Header */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-header h2 { font-size: 1.25rem; margin: 0; }

    /* Calendar Grid View */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-header {
      text-align: center;
      font-weight: 700;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .day-cell {
      min-height: 105px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .day-cell.empty { background: #f8fafc; border: none; }

    .day-number { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }

    .day-cell.meeting {
      background: var(--meeting-bg);
      border: 2px solid var(--meeting-border);
    }

    .day-cell.blackout {
      background: var(--blackout-bg);
      border: 2px solid var(--danger);
    }

    .meeting-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: #1d4ed8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .blackout-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--blackout-text);
      text-transform: uppercase;
    }

    .conductor-name-display {
      margin: 3px 0;
      line-height: 1.15;
      text-align: left;
      word-break: break-word;
    }

    .conductor-name-display .first-name,
    .conductor-name-display .last-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #000000;
    }

    .conductor-select {
      width: 100%;
      padding: 2px 4px;
      font-size: 0.75rem;
      font-weight: 500;
      min-height: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #475569;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .cell-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 4px;
    }

    .btn-link {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      padding: 2px 4px;
      min-height: auto;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Table View */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    th { background: #f1f5f9; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-override { background: var(--warning-bg); color: var(--warning-text); }
    .badge-blackout { background: var(--blackout-bg); color: var(--blackout-text); }
    .badge-standard { background: #e2e8f0; color: #475569; }

    .status-msg {
      font-size: 0.85rem;
      color: var(--secondary);
      font-weight: 600;
    }

    /* Modal Styles */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.5rem;
      padding: 0 6px;
      min-height: auto;
      line-height: 1;
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .modal-field select, .modal-field textarea {
      width: 100%;
      background: #f8fafc;
      color: var(--text);
    }

    .modal-field textarea {
      min-height: 195px;
      line-height: 1.4;
      resize: vertical;
    }

    .template-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px;
      background: #f1f5f9;
      border-radius: 8px;
    }

    .placeholder-hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 4px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    @media (max-width: 640px) {
      .calendar-grid { gap: 3px; }
      .day-cell { min-height: 85px; padding: 4px; }
      .day-header { font-size: 0.75rem; padding: 4px; }
      th:nth-child(3), td:nth-child(3) { display: none; }
      .modal-actions button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Conductor Schedule</h1>
    <div class="controls-group">
      <div class="view-toggle">
        <button id="btnViewCalendar" class="active" onclick="setViewMode('calendar')">📅 Calendar</button>
        <button id="btnViewTable" class="outline" onclick="setViewMode('table')">📋 Year List</button>
      </div>
      <div>
        <select id="yearSelect" onchange="handleYearChange()">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ROSTER MANAGEMENT PANEL -->
  <div class="roster-card">
    <div class="roster-header">
      <span>Approved Conductors Roster</span>
      <div class="anchor-control">
        <label for="rotationStartDateInput">Start #1 On:</label>
        <input type="date" id="rotationStartDateInput" value="2026-11-14" onchange="updateRotationStartDate(this.value)">
      </div>
    </div>
    <div class="roster-form">
      <input type="text" id="newConductorInput" class="roster-input" placeholder="Enter conductor name..." onkeydown="if(event.key==='Enter') addConductor()">
      <button onclick="addConductor()">+ Add</button>
    </div>
    <div class="roster-tags" id="rosterContainer"></div>
  </div>

  <!-- ACTION TOOLBAR -->
  <div class="toolbar">
    <div class="controls-group">
      <button class="accent" onclick="openShareModal('all', null)">📢 Share All Schedules</button>
      <button class="success" onclick="exportMasterICS()">📅 Full Year .ics</button>
      <button class="secondary" onclick="exportMonthICS()">🗓️ Month .ics</button>
      <button class="outline" onclick="copyTextSummary()">📋 Copy Month</button>
      <button class="outline" onclick="exportJSONBackup()">💾 Backup (JSON)</button>
      <button class="outline" onclick="document.getElementById('importFileInput').click()">📂 Restore</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importJSONBackup(event)">
    </div>
    <span id="statusMsg" class="status-msg"></span>
  </div>

  <!-- MONTHLY CALENDAR VIEW -->
  <div id="calendarViewSection">
    <div class="nav-header">
      <div class="controls-group">
        <button class="secondary" onclick="changeMonth(-1)">&larr; Previous</button>
        <button class="outline" onclick="goToToday()">Today</button>
        <button class="secondary" onclick="changeMonth(1)">Next &rarr;</button>
      </div>
      <h2 id="monthYearTitle"></h2>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- ANNUAL TABLE VIEW -->
  <div id="tableViewSection" style="display: none;">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Assigned Conductor</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="scheduleTableBody"></tbody>
    </table>
  </div>
</div>

<!-- SHARE & MESSAGE TEMPLATE MODAL -->
<div id="shareModal" class="modal-backdrop" onclick="if(event.target === this) closeShareModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="shareModalTitle">Share Schedule</h3>
      <button class="modal-close" onclick="closeShareModal()" title="Close">&times;</button>
    </div>

    <div class="modal-field">
      <label for="shareTimeframeSelect">Schedule Timeframe (Begins with Next Scheduled Date)</label>
      <select id="shareTimeframeSelect" onchange="refreshShareModalPreview()">
        <option value="1">Next 1 Month</option>
        <option value="2" selected>Next 3 Months</option>
        <option value="3">Next 6 Months</option>
        <option value="4">Rest of Selected Year (Upcoming Only)</option>
        <option value="5">Entire Selected Year (All Dates)</option>
      </select>
    </div>

    <div class="modal-field">
      <label for="shareMessageTextarea">Message Content (Edit freely before sending or save as default)</label>
      <textarea id="shareMessageTextarea"></textarea>
      <div id="sharePlaceholdersHint" class="placeholder-hint"></div>
    </div>

    <div class="template-controls">
      <span style="font-size:0.8rem; color:#334155; font-weight:600;">Default Template:</span>
      <div class="controls-group">
        <button type="button" class="outline" style="min-height:32px; padding:4px 10px; font-size:0.8rem;" onclick="saveModalAsDefaultTemplate()">💾 Save as Default</button>
        <button type="button" class="outline" style="min-height:32px; padding:4px 10px; font-size:0.8rem;" onclick="resetModalDefaultTemplate()">↺ Reset Default</button>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="outline" onclick="copyModalMessage()">📋 Copy Text</button>
      <button type="button" class="secondary" onclick="emailModalMessage()">✉️ Open in Email</button>
      <button type="button" class="success" onclick="shareModalMessage()">📤 Share (Text / Mail)</button>
    </div>
  </div>
</div>

<script>
  let currentDate = new Date();
  let currentViewMode = "calendar";
  const monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];
  const START_YEAR = 2026;
  const DEFAULT_ANCHOR_DATE = "2026-11-14";

  const DEFAULT_TEMPLATES = {
    individual:
      "Hi {firstName},\n\n" +
      "Here is your upcoming FS Conductor schedule:\n\n" +
      "{dates}\n\n" +
      "Location: Kingdom Hall\n" +
      "Direction: Please examine km 3/15 pp. 3-6 for suggestions.\n\n" +
      "Thank you for your willing spirit!",
    group:
      "Hello Brothers,\n\n" +
      "Here is the updated FS Conductor schedule ({timeframe}):\n\n" +
      "{schedules}\n\n" +
      "Location: Kingdom Hall (9:30 AM)\n" +
      "Direction: Please examine km 3/15 pp. 3-6 for suggestions.\n\n" +
      "Thank you for your willing spirit!"
  };

  let activeShareContext = {
    mode: "single",
    conductorName: null
  };

  // Unified State Architecture
  function loadAppState() {
    const saved = localStorage.getItem("conductor_schedule_state");
    if (saved) {
      const parsed = JSON.parse(saved);
      if (!parsed.templates) {
        parsed.templates = { ...DEFAULT_TEMPLATES };
      }
      if (!parsed.rotationStartDate) {
        parsed.rotationStartDate = DEFAULT_ANCHOR_DATE;
      }
      return parsed;
    }

    const legacyRoster = localStorage.getItem("conductor_roster");
    let migratedRoster = ["Julian Ramirez", "Judy Fain", "Dow Stephens", "Martin Tavarez", "Stacy Jaffnson"];

    if (legacyRoster) {
      try {
        migratedRoster = JSON.parse(legacyRoster);
      } catch(e) {}
    }

    const migratedOverrides = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith("conductor_override_")) {
        const parts = key.split("_");
        if (parts.length === 5) {
          const y = parts[2];
          const m = String(parts[3]).padStart(2, '0');
          const d = String(parts[4]).padStart(2, '0');
          migratedOverrides[`${y}-${m}-${d}`] = localStorage.getItem(key);
        }
      }
    }

    const newState = {
      roster: migratedRoster,
      overrides: migratedOverrides,
      blackouts: {},
      templates: { ...DEFAULT_TEMPLATES },
      rotationStartDate: DEFAULT_ANCHOR_DATE
    };

    localStorage.setItem("conductor_schedule_state", JSON.stringify(newState));
    return newState;
  }

  function saveAppState(state) {
    localStorage.setItem("conductor_schedule_state", JSON.stringify(state));
    renderUI();
  }

  function updateRotationStartDate(dateValue) {
    const state = loadAppState();
    state.rotationStartDate = dateValue || DEFAULT_ANCHOR_DATE;
    saveAppState(state);
    showStatus("Rotation start date updated!");
  }

  // Returns 2nd, 4th, and (when present) 5th Saturday of the month
  function getMeetingSaturdays(year, month) {
    let saturdays = [];
    let date = new Date(year, month, 1);
    while (date.getMonth() === month) {
      if (date.getDay() === 6) {
        saturdays.push(date.getDate());
      }
      date.setDate(date.getDate() + 1);
    }
    return {
      second: saturdays[1],
      fourth: saturdays[3],
      fifth: saturdays[4]
    };
  }

  // Anchored Multi-Year Continuous Rotation Engine (2nd, 4th, and 5th Saturdays)
  function getRotationalConductor(targetYear, targetMonth, targetDay, state) {
    if (!state.roster || state.roster.length === 0) return "Unassigned";

    const anchorDateKey = state.rotationStartDate || DEFAULT_ANCHOR_DATE;
    const anchorYear = parseInt(anchorDateKey.split("-")[0], 10) || START_YEAR;
    const endYear = Math.max(targetYear, anchorYear, 2028);

    let activeMeetings = [];
    for (let y = START_YEAR; y <= endYear; y++) {
      for (let m = 0; m < 12; m++) {
        const sats = getMeetingSaturdays(y, m);
        [sats.second, sats.fourth, sats.fifth].forEach(day => {
          if (!day) return;
          const dateKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          if (!state.blackouts || !state.blackouts[dateKey]) {
            activeMeetings.push(dateKey);
          }
        });
      }
    }

    const targetKey = `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}`;
    const targetIndex = activeMeetings.indexOf(targetKey);
    if (targetIndex === -1) return state.roster[0];

    let anchorIndex = activeMeetings.findIndex(k => k >= anchorDateKey);
    if (anchorIndex === -1) anchorIndex = 0;

    const offset = targetIndex - anchorIndex;
    const len = state.roster.length;
    const rosterIndex = ((offset % len) + len) % len;
    return state.roster[rosterIndex];
  }

  /* --- ROSTER CONTROLLERS --- */
  function addConductor() {
    const input = document.getElementById("newConductorInput");
    const name = input.value.trim();
    if (name) {
      const state = loadAppState();
      state.roster.push(name);
      input.value = "";
      saveAppState(state);
    }
  }

  function removeConductor(index) {
    const state = loadAppState();
    state.roster.splice(index, 1);
    saveAppState(state);
  }

  function moveConductor(index, direction) {
    const state = loadAppState();
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= state.roster.length) return;

    const temp = state.roster[index];
    state.roster[index] = state.roster[newIndex];
    state.roster[newIndex] = temp;
    saveAppState(state);
  }

  function renderRoster(state) {
    const dateInput = document.getElementById("rotationStartDateInput");
    if (dateInput) {
      dateInput.value = state.rotationStartDate || DEFAULT_ANCHOR_DATE;
    }

    const container = document.getElementById("rosterContainer");
    container.innerHTML = "";
    if (state.roster.length === 0) {
      container.innerHTML = `<span style="font-size:0.85rem; color:#94a3b8;">No conductors added. Add names above.</span>`;
      return;
    }
    state.roster.forEach((name, index) => {
      const tag = document.createElement("div");
      tag.className = "tag";
      const isFirst = index === 0;
      const isLast = index === state.roster.length - 1;

      tag.innerHTML = `
        <span class="tag-num">${index + 1}</span>
        <span>${name}</span>
        <div class="tag-actions">
          <button class="tag-move" onclick="moveConductor(${index}, -1)" title="Move earlier in rotation" ${isFirst ? 'disabled' : ''}>◀</button>
          <button class="tag-move" onclick="moveConductor(${index}, 1)" title="Move later in rotation" ${isLast ? 'disabled' : ''}>▶</button>
          <button class="btn-link btn-ics" data-name="${encodeURIComponent(name)}" style="color:#3730a3; font-size:0.75rem; padding:0 4px; font-weight:600;" title="Download .ics calendar file">📥 .ics</button>
          <button class="btn-link btn-share" data-name="${encodeURIComponent(name)}" style="color:#059669; font-size:0.75rem; padding:0 4px; font-weight:600;" title="Customize & share dates">📤 Share</button>
          <button class="tag-remove" onclick="removeConductor(${index})" title="Remove">&times;</button>
        </div>
      `;
      
      tag.querySelector('.btn-ics').addEventListener('click', (e) => {
        downloadConductorICS(decodeURIComponent(e.currentTarget.dataset.name));
      });
      tag.querySelector('.btn-share').addEventListener('click', (e) => {
        openShareModal('single', decodeURIComponent(e.currentTarget.dataset.name));
      });

      container.appendChild(tag);
    });
  }

  /* --- VIEW & CALENDAR CONTROLLERS --- */
  function setViewMode(mode) {
    currentViewMode = mode;
    document.getElementById("btnViewCalendar").className = mode === 'calendar' ? 'active' : 'outline';
    document.getElementById("btnViewTable").className = mode === 'table' ? 'active' : 'outline';
    document.getElementById("calendarViewSection").style.display = mode === 'calendar' ? 'block' : 'none';
    document.getElementById("tableViewSection").style.display = mode === 'table' ? 'block' : 'none';
    renderUI();
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    document.getElementById("yearSelect").value = currentDate.getFullYear();
    renderUI();
  }

  function goToToday() {
    currentDate = new Date();
    document.getElementById("yearSelect").value = currentDate.getFullYear();
    renderUI();
  }

  function handleYearChange() {
    const year = parseInt(document.getElementById("yearSelect").value, 10);
    currentDate.setFullYear(year);
    renderUI();
  }

  function toggleBlackout(dateKey) {
    const state = loadAppState();
    if (state.blackouts[dateKey]) {
      delete state.blackouts[dateKey];
    } else {
      state.blackouts[dateKey] = true;
    }
    saveAppState(state);
  }

  function setOverride(dateKey, conductorName) {
    const state = loadAppState();
    if (!conductorName) {
      delete state.overrides[dateKey];
    } else {
      state.overrides[dateKey] = conductorName;
    }
    saveAppState(state);
  }

  function renderUI() {
    const state = loadAppState();
    renderRoster(state);

    if (currentViewMode === "calendar") {
      renderCalendarView(state);
    } else {
      renderTableView(state);
    }
  }

  function renderCalendarView(state) {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthYearTitle").innerText = `${monthNames[month]} ${year}`;
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    dayHeaders.forEach(day => {
      const header = document.createElement("div");
      header.className = "day-header";
      header.innerText = day;
      grid.appendChild(header);
    });

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    const meetingSaturdays = getMeetingSaturdays(year, month);
    const today = new Date();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "day-cell empty";
      grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= totalDays; day++) {
      const cell = document.createElement("div");
      cell.className = "day-cell";

      const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
      if (isToday) cell.style.border = "2px solid var(--danger)";

      const dayNum = document.createElement("div");
      dayNum.className = "day-number";
      dayNum.innerText = day;
      cell.appendChild(dayNum);

      const is2ndSaturday = day === meetingSaturdays.second;
      const is4thSaturday = day === meetingSaturdays.fourth;
      const is5thSaturday = day === meetingSaturdays.fifth;

      if (is2ndSaturday || is4thSaturday || is5thSaturday) {
        const monthStr = String(month + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${monthStr}-${dayStr}`;

        const isBlackout = !!state.blackouts[dateKey];
        const savedOverride = state.overrides[dateKey];
        const autoAssigned = getRotationalConductor(year, month, day, state);

        if (isBlackout) {
          cell.classList.add("blackout");
          const tag = document.createElement("div");
          tag.className = "blackout-tag";
          tag.innerText = "Cancelled";
          cell.appendChild(tag);
        } else {
          cell.classList.add("meeting");
          const tag = document.createElement("div");
          tag.className = "meeting-tag";
          if (is2ndSaturday) tag.innerText = "2nd Sat Meeting";
          else if (is4thSaturday) tag.innerText = "4th Sat Meeting";
          else tag.innerText = "5th Sat Meeting";
          cell.appendChild(tag);

          const activeConductor = savedOverride || autoAssigned;
          const nameParts = (activeConductor || "").trim().split(/\s+/);
          const firstName = nameParts[0] || "";
          const lastName = nameParts.slice(1).join(" ") || "";

          const nameDisplay = document.createElement("div");
          nameDisplay.className = "conductor-name-display";
          if (lastName) {
            nameDisplay.innerHTML = `<div class="first-name">${firstName}</div><div class="last-name">${lastName}</div>`;
          } else {
            nameDisplay.innerHTML = `<div class="first-name">${firstName}</div>`;
          }
          cell.appendChild(nameDisplay);

          const select = document.createElement("select");
          select.className = "conductor-select";

          const autoOpt = document.createElement("option");
          autoOpt.value = "";
          autoOpt.innerText = `Auto (${autoAssigned})`;
          select.appendChild(autoOpt);

          state.roster.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.innerText = name;
            select.appendChild(opt);
          });

          select.value = savedOverride || "";
          select.addEventListener("change", (e) => setOverride(dateKey, e.target.value));
          cell.appendChild(select);
        }

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "cell-actions";
        actionsDiv.innerHTML = `<button class="btn-link" onclick="toggleBlackout('${dateKey}')">${isBlackout ? 'Restore' : 'Cancel'}</button>`;
        cell.appendChild(actionsDiv);
      }

      grid.appendChild(cell);
    }
  }

  function renderTableView(state) {
    const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);
    const tbody = document.getElementById("scheduleTableBody");
    tbody.innerHTML = "";

    for (let month = 0; month < 12; month++) {

        const dayStr = String(day).padStart(2, '0');

        const isBlackout = !!state.blackouts[dateKey];
        const override = state.overrides[dateKey];

  /* --- SCHEDULE FILTERING & TEMPLATE HELPERS --- */
  function getAllScheduleSlots(state) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);
    const maxYear = Math.max(today.getFullYear(), selectedYear) + 1;

    let allSlots = [];
    for (let y = START_YEAR; y <= maxYear; y++) {
      for (let month = 0; month < 12; month++) {
        const sats = getMeetingSaturdays(y, month);
        [sats.second, sats.fourth, sats.fifth].forEach(day => {
          if (!day) return;
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(day).padStart(2, '0');
          const dateKey = `${y}-${monthStr}-${dayStr}`;
          const slotDate = new Date(y, month, day);

          if (state.blackouts && state.blackouts[dateKey]) return;

          const conductor = (state.overrides && state.overrides[dateKey]) || getRotationalConductor(y, month, day, state);
          const formattedDate = slotDate.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });

          allSlots.push({
            dateKey,
            slotDate,
            monthStr,
            dayStr,
            day,
            month,
            year: y,
            conductor,
            formattedDate
          });
        });
      }
    }
    return allSlots;
  }

  function getConductorAssignedDates(conductorName, rangeOption, state) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);

    const conductorSlots = getAllScheduleSlots(state).filter(s => s.conductor === conductorName);
    const upcoming = conductorSlots.filter(s => s.slotDate >= today);

    if (rangeOption === "1") {
      if (upcoming.length === 0) return [];
      const first = upcoming[0].slotDate;
      const cutoff = new Date(first.getFullYear(), first.getMonth() + 1, first.getDate() + 6);
      return upcoming.filter(d => d.slotDate <= cutoff);
    } else if (rangeOption === "2") {
      if (upcoming.length === 0) return [];
      const first = upcoming[0].slotDate;
      const cutoff = new Date(first.getFullYear(), first.getMonth() + 3, first.getDate() + 6);
      return upcoming.filter(d => d.slotDate <= cutoff);
    } else if (rangeOption === "3") {
      if (upcoming.length === 0) return [];
      const first = upcoming[0].slotDate;
      const cutoff = new Date(first.getFullYear(), first.getMonth() + 6, first.getDate() + 6);
      return upcoming.filter(d => d.slotDate <= cutoff);
    } else if (rangeOption === "4") {
      return upcoming.filter(d => d.year === selectedYear);
    } else if (rangeOption === "5") {
      return conductorSlots.filter(d => d.year === selectedYear);
    }
    return upcoming;
  }

  function getAllConductorsGroupedSchedules(rangeOption, state) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const selectedYear = parseInt(document.getElementById("yearSelect").value, 10);

    const allSlots = getAllScheduleSlots(state);
    const globalUpcoming = allSlots.filter(s => s.slotDate >= today);

    let filteredSlots = [];
    if (rangeOption === "1") {
      if (globalUpcoming.length > 0) {
        const first = globalUpcoming[0].slotDate;
        const cutoff = new Date(first.getFullYear(), first.getMonth() + 1, first.getDate() + 6);
        filteredSlots = globalUpcoming.filter(d => d.slotDate <= cutoff);
      }
    } else if (rangeOption === "2") {
      if (globalUpcoming.length > 0) {
        const first = globalUpcoming[0].slotDate;
        const cutoff = new Date(first.getFullYear(), first.getMonth() + 3, first.getDate() + 6);
        filteredSlots = globalUpcoming.filter(d => d.slotDate <= cutoff);
      }
    } else if (rangeOption === "3") {
      if (globalUpcoming.length > 0) {
        const first = globalUpcoming[0].slotDate;
        const cutoff = new Date(first.getFullYear(), first.getMonth() + 6, first.getDate() + 6);
        filteredSlots = globalUpcoming.filter(d => d.slotDate <= cutoff);
      }
    } else if (rangeOption === "4") {
      filteredSlots = globalUpcoming.filter(d => d.year === selectedYear);
    } else if (rangeOption === "5") {
      filteredSlots = allSlots.filter(d => d.year === selectedYear);
    }

    return state.roster.map(name => {
      const dates = filteredSlots.filter(s => s.conductor === name);
      return { name, dates };
    }).filter(entry => entry.dates.length > 0);
  }

  /* --- SHARE & TEMPLATE MODAL CONTROLLERS --- */
  function openShareModal(mode, conductorName) {
    activeShareContext = { mode, conductorName };
    const titleEl = document.getElementById("shareModalTitle");
    const hintEl = document.getElementById("sharePlaceholdersHint");

    if (mode === "single") {
      titleEl.innerText = `Share Schedule: ${conductorName}`;
      hintEl.innerText = "Available tags: {firstName}, {fullName}, {dates}";
    } else {
      titleEl.innerText = "Share Schedule: All Conductors";
      hintEl.innerText = "Available tags: {schedules}, {timeframe}";
    }

    refreshShareModalPreview();
    document.getElementById("shareModal").classList.add("open");
  }

  function closeShareModal() {
    document.getElementById("shareModal").classList.remove("open");
  }

  function refreshShareModalPreview() {
    const state = loadAppState();
    const rangeSelect = document.getElementById("shareTimeframeSelect");
    const rangeOption = rangeSelect.value;
    const timeframeLabel = rangeSelect.options[rangeSelect.selectedIndex].text;
    const textarea = document.getElementById("shareMessageTextarea");

    if (activeShareContext.mode === "single") {
      const name = activeShareContext.conductorName;
      const firstName = name.trim().split(/\s+/)[0] || name;
      const dates = getConductorAssignedDates(name, rangeOption, state);
      const dateList = dates.length > 0
        ? dates.map(d => `• ${d.formattedDate} (9:30 AM)`).join("\n")
        : "• No scheduled dates found in this timeframe.";

      const template = (state.templates && state.templates.individual) || DEFAULT_TEMPLATES.individual;
      textarea.value = template
        .replace(/\{firstName\}/g, firstName)
        .replace(/\{fullName\}/g, name)
        .replace(/\{dates\}/g, dateList);
    } else {
      const grouped = getAllConductorsGroupedSchedules(rangeOption, state);
      const scheduleBlocks = grouped.length > 0
        ? grouped.map(g => {
            const lines = g.dates.map(d => `  • ${d.formattedDate} (9:30 AM)`).join("\n");
            return `${g.name}:\n${lines}`;
          }).join("\n\n")
        : "No scheduled dates found in this timeframe.";

      const template = (state.templates && state.templates.group) || DEFAULT_TEMPLATES.group;
      textarea.value = template
        .replace(/\{schedules\}/g, scheduleBlocks)
        .replace(/\{timeframe\}/g, timeframeLabel);
    }
  }

  function saveModalAsDefaultTemplate() {
    const state = loadAppState();
    if (!state.templates) state.templates = { ...DEFAULT_TEMPLATES };

    const rawText = document.getElementById("shareMessageTextarea").value;
    if (activeShareContext.mode === "single") {
      state.templates.individual = rawText;
    } else {
      state.templates.group = rawText;
    }

    saveAppState(state);
    showStatus("Default message template saved!");
    alert("Saved! Your updated wording will be used as the default for future schedules.");

  function resetModalDefaultTemplate() {
    const state = loadAppState();
    if (!state.templates) state.templates = { ...DEFAULT_TEMPLATES };

    if (activeShareContext.mode === "single") {
      state.templates.individual = DEFAULT_TEMPLATES.individual;
    } else {
      state.templates.group = DEFAULT_TEMPLATES.group;
    }

    saveAppState(state);
    refreshShareModalPreview();
    showStatus("Template reset to original default.");

  function downloadConductorICS(conductorName) {
    const state = loadAppState();
    const choice = prompt(
      `Select .ics calendar timeframe for ${conductorName}:\n\n` +
      `1 = Next 1 Month\n` +
      `2 = Next 3 Months\n` +
      `3 = Next 6 Months\n` +
      `4 = Rest of Year (Upcoming Only)\n` +
      `5 = Entire Year (All Dates)\n\n` +
      `Enter option number (1-5):`,
      "2"
    );

    if (choice === null) return;

    const nowString = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const dates = getConductorAssignedDates(conductorName, choice.trim(), state);

    if (dates.length === 0) {
      alert(`No scheduled dates found for ${conductorName}.`);
      return;
    }

    let icsLines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Conductor Schedule Generator//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      `X-WR-CALNAME:${conductorName} - FS Conductor Schedule`
    ];

    dates.forEach(d => {
      const dateStr = `${d.year}${d.monthStr}${d.dayStr}`;
      icsLines.push(
        "BEGIN:VEVENT",
        `UID:conductor-${d.dateKey}@conductorschedule.local`,
        `DTSTAMP:${nowString}`,
        `DTSTART;VALUE=DATE:${dateStr}`,
        `DTEND;VALUE=DATE:${dateStr}`,
        `SUMMARY:FS Conductor: ${conductorName} (9:30 AM)`,
        `LOCATION:Kingdom Hall`,
        `DESCRIPTION:Carefully examine km 3/15 pp. 3-6 for direction & suggestions.`,
        "STATUS:CONFIRMED",
        "BEGIN:VALARM",
        "TRIGGER:-PT24H",
        "ACTION:DISPLAY",
        `DESCRIPTION:Reminder: FS Conductor Duty Tomorrow - ${conductorName}`,
        "END:VALARM",
        "BEGIN:VALARM",
        "TRIGGER:-PT12H",
        "ACTION:DISPLAY",
        `DESCRIPTION:Reminder: FS Conductor Duty in 12 Hours - ${conductorName}`,
        "END:VALARM",
        "END:VEVENT"
      );
    });

    icsLines.push("END:VCALENDAR");

    const icsData = icsLines.join("\r\n");
    const fileName = `FS_Conductor_${conductorName.replace(/\s+/g, '_')}.ics`;
    const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showStatus(`Downloaded .ics for ${conductorName}!`);
  }

  function exportMonthICS() {

    const meetingDays = [sats.second, sats.fourth, sats.fifth];
    const nowString = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

    let icsLines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Conductor Schedule//EN"];

    meetingDays.forEach(day => {

      const dayStr = String(day).padStart(2, '0');

      const conductor = (state.overrides && state.overrides[dateKey]) || getRotationalConductor(year, month, day, state);
      const dateStr = `${year}${monthStr}${dayStr}`;

      icsLines.push(
        "BEGIN:VEVENT",
        `UID:conductor-${dateKey}@conductorschedule.local`,
        `DTSTAMP:${nowString}`,
        `DTSTART;VALUE=DATE:${dateStr}`,
        `DTEND;VALUE=DATE:${dateStr}`,
        `SUMMARY:FS Conductor: ${conductor} (9:30 AM)`,
        `LOCATION:Kingdom Hall`,
        `DESCRIPTION:Carefully examine km 3/15 pp. 3-6 for direction & suggestions.`,
        "STATUS:CONFIRMED",
        "BEGIN:VALARM",
        "TRIGGER:-PT24H",
        "ACTION:DISPLAY",
        `DESCRIPTION:Reminder: FS Conductor Duty Tomorrow - ${conductor}`,
        "END:VALARM",
        "BEGIN:VALARM",
        "TRIGGER:-PT12H",
        "ACTION:DISPLAY",
        `DESCRIPTION:Reminder: FS Conductor Duty in 12 Hours - ${conductor}`,
        "END:VALARM",
        "END:VEVENT"
      );
    });

    icsLines.push("END:VCALENDAR");

    const blob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Conductor_Schedule_${monthNames[month]}_${year}.ics`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showStatus("Exported Month .ics!");
  }

  function copyTextSummary() {
    const state = loadAppState();
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const sats = getMeetingSaturdays(year, month);

    const getFormattedSlot = (day) => {
      if (!day) return "";
      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      const dateKey = `${year}-${monthStr}-${dayStr}`;

      if (state.blackouts[dateKey]) return "CANCELLED";
      return state.overrides[dateKey] || getRotationalConductor(year, month, day, state);
    };

    const c2 = getFormattedSlot(sats.second);
    const c4 = getFormattedSlot(sats.fourth);

    const lines = [
      `Conductor Schedule - ${monthNames[month]} ${year}`,
      `----------------------------------------`,
      `• ${monthNames[month]} ${sats.second}, ${year} (2nd Sat): ${c2}`,
      `• ${monthNames[month]} ${sats.fourth}, ${year} (4th Sat): ${c4}`
    ];

    if (sats.fifth) {
      const c5 = getFormattedSlot(sats.fifth);
      lines.push(`• ${monthNames[month]} ${sats.fifth}, ${year} (5th Sat): ${c5}`);
    }

    navigator.clipboard.writeText(lines.join("\n")).then(() => {
      showStatus("Copied to clipboard!");
    });
  }

  /* --- JSON BACKUP & RESTORE HANDLERS --- */
  function exportJSONBackup() {
    const state = loadAppState();
    const jsonStr = JSON.stringify(state, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    const dateStamp = new Date().toISOString().split('T')[0];
    link.download = `conductor-schedule-backup-${dateStamp}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showStatus("Backup JSON downloaded!");
  }

  function importJSONBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (importedData && Array.isArray(importedData.roster)) {
          saveAppState(importedData);
          showStatus("Schedule restored successfully!");
        } else {
          alert("Invalid backup file format. Expected a conductor schedule backup object.");
        }
      } catch (err) {
        alert("Error reading JSON backup file: " + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  // Close modal on Escape key
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeShareModal();
  });

  // Register PWA Service Worker with auto-reload on update
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((registration) => {
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
                window.location.reload();
              }
            });
          }
        });
      }).catch(() => {});
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  }

  window.addEventListener("DOMContentLoaded", renderUI);
</script>

</body>
</html>
